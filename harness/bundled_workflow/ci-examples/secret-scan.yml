# Copy to .github/workflows/secret-scan.yml
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@v3.88.35
        with:
          path: ./
          extra_args: --only-verified
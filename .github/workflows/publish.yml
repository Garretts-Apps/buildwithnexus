name: Publish to npm

# The published package is a thin, zero-dependency, script-free wrapper: the
# FIRST RUN fetches the SHA-256-verified prebuilt binary for the user's
# platform from the GitHub Release (no npm install scripts — keeps
# supply-chain scanners green). So publishing is just `npm publish` of the
# wrapper — no bundle step.
#
# Sequencing: publishing is chained off the `release` workflow's COMPLETION, not
# the raw `v*` tag. release.yml builds and attaches the per-platform binaries on
# the tag; only once that whole workflow succeeds do we publish to npm — so a
# user never installs a version whose binaries aren't up yet (the first-run
# fast path). workflow_dispatch stays for manual/emergency publishes.
on:
  workflow_run:
    workflows: ["release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version_bump:
        # Default 'none': publish the version already on main, whose release
        # binaries exist. A bump here can't push a tag (OIDC-only, no PAT), so
        # release.yml never builds binaries for the bumped version — leaving
        # the first-run download with a 404. Bump via a PR to main instead.
        description: "Version bump — keep 'none' to publish the current version (recommended)"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - patch
          - minor
          - major

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Gate: a successful `release` run — from a v* tag push, an automatic
    # main-push release (version-gated in release.yml), or a manual run — or a
    # direct manual dispatch of this workflow. A failed release never
    # publishes; a version-gated release that skipped chains into a run that
    # self-skips on its own already-published checks.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           (startsWith(github.event.workflow_run.head_branch, 'v') ||
            github.event.workflow_run.head_branch == 'main' ||
            github.event.workflow_run.event == 'workflow_dispatch')) }}
    permissions:
      # write only for the manual version-bump path, which pushes a commit and
      # tag; every other path just reads. (Permissions can't be conditional.)
      contents: write
      id-token: write   # REQUIRED for OIDC-based npm Trusted Publisher
      attestations: read  # verify the release binaries' build provenance

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # On the release-triggered path, publish exactly the tagged commit the
          # binaries were built from; on manual dispatch, the current branch.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          # Auth is OIDC Trusted Publisher (no npm token, no PAT). Checkout only
          # needs read access to this public repo, so the default GITHUB_TOKEN is
          # enough — do NOT require a secret here, or an unset secret makes
          # checkout fail with "could not read Username" before publish runs.
          # The token stays on disk only when the bump step has to push.
          persist-credentials: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version_bump != 'none' }}
          submodules: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          # Note: registry-url *intentionally omitted* — when a Trusted Publisher
          # is configured for this package on npmjs.com, npm publish auto-detects
          # the OIDC context from GitHub Actions and uses it for auth. Setting
          # registry-url + .npmrc with NODE_AUTH_TOKEN fights that flow.

      # Node 22 ships npm 10.x, which has no OIDC Trusted Publishing support, so
      # `npm publish` falls back to token auth, finds none, and fails ENEEDAUTH.
      # OIDC trusted publishing requires npm >= 11.5.1 — install it explicitly,
      # pinned so a new npm release can't change the publish path unreviewed.
      - name: Upgrade npm for OIDC trusted publishing
        env:
          NPM_VERSION: "12.1.0"
        run: |
          npm install -g "npm@${NPM_VERSION}"
          npm --version

      - name: Bump version + tag
        # Only the manual path bumps; the release-triggered path publishes the
        # already-tagged version as-is.
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version_bump != 'none' }}
        env:
          BUMP: ${{ github.event.inputs.version_bump }}
        run: |
          set -euo pipefail
          case "$BUMP" in
            patch|minor|major) ;;
            *) echo "::error::unexpected version_bump '$BUMP'"; exit 1 ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # No package-lock.json in the wrapper — only package.json changes.
          NEW_VERSION=$(npm version "$BUMP" --no-git-tag-version)
          echo "New version: $NEW_VERSION"
          git add package.json
          git commit -m "chore(release): $NEW_VERSION [skip ci]"
          git tag "$NEW_VERSION"
          # A version on npm with no matching commit and tag on main can't be
          # reproduced or released with binaries, so a failed push stops here.
          if ! git push origin HEAD:main --follow-tags; then
            echo "::error::Could not push the bump commit and tag to main. Nothing was published."
            exit 1
          fi

      # Release assets can be replaced after publishing, so their .sha256
      # files only catch corruption. Before anything reaches npm, check each
      # binary against its build-provenance attestation (Sigstore, tied to
      # release.yml in this repo), then record the verified hashes in
      # checksums.json inside the immutable npm tarball. The launcher's
      # first-run download and the platform packages below trust only these.
      - name: Verify release binaries and record checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${V}"
          mkdir -p verified
          echo '{}' > checksums.json
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc; do
            ext=""; [[ "$t" == *windows* ]] && ext=".exe"
            asset="buildwithnexus-${t}${ext}"
            curl -fsSL --retry 3 -o "verified/${asset}" "${BASE}/${asset}"
            gh attestation verify "verified/${asset}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml"
            sum=$(sha256sum "verified/${asset}" | cut -d' ' -f1)
            ASSET="$asset" SUM="$sum" node -e '
              const fs = require("fs");
              const j = JSON.parse(fs.readFileSync("checksums.json", "utf8"));
              j[process.env.ASSET] = process.env.SUM;
              fs.writeFileSync("checksums.json", JSON.stringify(j, null, 2) + "\n");
            '
          done
          cat checksums.json

      # Guard the launch path: a syntax error in the wrapper or bootstrap
      # would break `npm install` for every user. Cheap to check, expensive to miss.
      - name: Syntax-check wrapper scripts
        run: node --check bin/buildwithnexus.js && for f in scripts/*.js; do node --check "$f"; done

      # Confirm the published file set resolves (bin/, scripts, harness sources)
      # without actually publishing.
      - name: Verify package contents
        run: npm pack --dry-run

      # Idempotency: npm versions are immutable, so republishing one that already
      # exists hard-fails. The release→publish chain can legitimately re-run for a
      # version that's already live (e.g. a manual publish happened first), so
      # skip the publish instead of failing the run.
      - name: Check if this version is already on npm
        id: published
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "buildwithnexus@$V" version >/dev/null 2>&1; then
            echo "buildwithnexus@$V is already on npm — skipping publish."
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # Platform binary packages (buildwithnexus-<os>-<cpu>): download each
      # release asset, verify its SHA-256 against the published checksum, and
      # publish it as its own package. The main package selects the right one
      # at install time via optionalDependencies — so the main tarball needs
      # no install scripts and no network code at all.
      #
      # FIRST-TIME SETUP: npm OIDC cannot CREATE a package, so each platform
      # package's first version has to be published with a token:
      #   NPM_TOKEN=<granular token> scripts/first-publish-platform-packages.sh <version>
      # (or store NPM_TOKEN as a repo secret and re-run this workflow). Then
      # attach a Trusted Publisher (this repo, publish.yml) to each package at
      #   https://www.npmjs.com/package/buildwithnexus-<platform>/access
      # and delete the token; later versions publish via OIDC.
      #
      # Until then this step does NOT fail the run: installs work without
      # the platform packages (the launcher downloads the checksum-verified
      # release binary on first run). Instead, optionalDependencies in the
      # published manifest list only the platform packages whose exact version
      # is on the registry, so npm never resolves a version that doesn't
      # exist, and the run carries a warning naming the fix.
      # Runs on every invocation (not gated on the main-package check) and
      # skips versions that already exist, so re-running fills in the gaps.
      - name: Publish platform binary packages
        env:
          # One-time bootstrap only (see above). Delete the secret once every
          # platform package has a Trusted Publisher.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          declare -A T=(
            [linux-x64]=x86_64-unknown-linux-gnu
            [linux-arm64]=aarch64-unknown-linux-gnu
            [darwin-x64]=x86_64-apple-darwin
            [darwin-arm64]=aarch64-apple-darwin
            [win32-x64]=x86_64-pc-windows-msvc
          )
          present=()
          for p in "${!T[@]}"; do
            t=${T[$p]}; ext=""; [[ "$t" == *windows* ]] && ext=".exe"
            if npm view "buildwithnexus-${p}@${V}" version >/dev/null 2>&1; then
              echo "buildwithnexus-${p}@${V} already published — skipping."
              present+=("$p")
              continue
            fi
            mkdir -p "npm/${p}/bin"
            # The attestation-verified copy from the step above.
            cp "verified/buildwithnexus-${t}${ext}" "npm/${p}/bin/buildwithnexus${ext}"
            expected=$(A="buildwithnexus-${t}${ext}" node -p "require('./checksums.json')[process.env.A]")
            got=$(sha256sum "npm/${p}/bin/buildwithnexus${ext}" | cut -d' ' -f1)
            [[ "$expected" == "$got" ]] || { echo "::error::checksum mismatch for ${p}"; exit 1; }
            chmod +x "npm/${p}/bin/buildwithnexus${ext}"
            PKG_FILE="npm/${p}/package.json" V="$V" node -e "const fs=require('fs'),f=process.env.PKG_FILE,j=JSON.parse(fs.readFileSync(f,'utf8'));j.version=process.env.V;fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')"
            # OIDC first; bootstrap-token fallback for the first publish of
            # a brand-new package (see env comment above).
            # NOTE: --provenance requires an OIDC token. The NPM_TOKEN fallback
            # uses a classic token, so we intentionally omit --provenance here —
            # passing it causes npm to return 404 on new packages.
            if (cd "npm/${p}" && npm publish --access public --provenance); then
              present+=("$p")
            elif [ -n "${NPM_TOKEN}" ]; then
              echo "OIDC publish failed for buildwithnexus-${p} — using the one-time bootstrap token (no provenance)"
              if (cd "npm/${p}" && npm publish --access public \
                    --//registry.npmjs.org/:_authToken="${NPM_TOKEN}"); then
                present+=("$p")
              else
                echo "bootstrap-token publish of buildwithnexus-${p} also failed"
              fi
            else
              echo "OIDC publish of buildwithnexus-${p} failed and no NPM_TOKEN bootstrap secret is set."
            fi
          done
          missing=()
          for p in "${!T[@]}"; do
            [[ " ${present[*]} " == *" $p "* ]] || missing+=("$p")
          done

          # Pin optionalDependencies to this exact version, but only for the
          # platform packages that exist on the registry. Listing a version
          # that doesn't exist makes npm's resolver hunt for it on every
          # install; leaving it out sends that platform to the launcher's
          # first-run download instead.
          PRESENT="${present[*]}" V="$V" node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const deps = {};
            for (const p of (process.env.PRESENT || "").split(" ").filter(Boolean).sort()) {
              deps["buildwithnexus-" + p] = process.env.V;
            }
            if (Object.keys(deps).length) j.optionalDependencies = deps;
            else delete j.optionalDependencies;
            fs.writeFileSync("package.json", JSON.stringify(j, null, 2) + "\n");
            console.log("optionalDependencies:", JSON.stringify(j.optionalDependencies || {}));
          '

          if [ "${#missing[@]}" -gt 0 ]; then
            list=""
            for p in "${missing[@]}"; do list+="buildwithnexus-${p}@${V} "; done
            echo "::warning title=Platform packages not on npm::${list}are not published, so those platforms install through the first-run download. One-time fix: NPM_TOKEN=<granular token> scripts/first-publish-platform-packages.sh ${V}, then attach a Trusted Publisher to each package."
            {
              echo "### Platform packages missing from npm"
              echo ""
              for p in "${missing[@]}"; do echo "- \`buildwithnexus-${p}@${V}\`"; done
              echo ""
              echo "These were left out of the published \`optionalDependencies\`; installs on those platforms use the checksum-verified first-run download."
              echo "One-time fix, from a maintainer machine:"
              echo ""
              echo "    NPM_TOKEN=<granular token> scripts/first-publish-platform-packages.sh ${V}"
              echo ""
              echo "Then attach a Trusted Publisher (Garretts-Apps/buildwithnexus, publish.yml) to each package so later versions publish via OIDC."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # === AUTH ===
      # The publish step uses npm's OIDC Trusted Publisher flow. It expects:
      #   1. Trusted Publisher configured on npmjs.com for the
      #      buildwithnexus package, scoped to:
      #        - Org: Garretts-Apps
      #        - Repo: buildwithnexus
      #        - Workflow: publish.yml
      #        - Environment: (blank)
      #   2. id-token: write permission on this job (set above).
      #
      # No NPM_TOKEN is read. Token-based auth (and its 2FA gate) is bypassed.
      #
      # Configure here:
      #   https://www.npmjs.com/package/buildwithnexus/access → Trusted Publishers
      - name: Publish to npm (OIDC Trusted Publisher + provenance)
        if: steps.published.outputs.already == 'false'
        run: npm publish --access public --provenance

      # crates.io: `cargo install buildwithnexus` (both binaries) and
      # `cargo install bwn` (alias crate). OIDC only — the auth action
      # exchanges this job's OIDC token for a 30-minute crates.io token.
      # Like npm, crates.io Trusted Publishing must be configured per crate
      # (crates.io → crate → Settings → Trusted Publishing: this repo,
      # publish.yml) and the FIRST publish of each crate is a one-time
      # `cargo publish` from a maintainer machine (cargo login).
      # Not gated on the npm check: crates.io can be published later (add the
      # token or configure Trusted Publishing, then re-run this workflow) —
      # the step skips crate versions that already exist.
      - name: Install Rust for crates.io publish
        if: github.event_name == 'workflow_dispatch'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (branch head 2026-09-29)

      - name: Get crates.io token via OIDC
        if: github.event_name == 'workflow_dispatch'
        id: cratesio
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        if: github.event_name == 'workflow_dispatch'
        env:
          # OIDC token when Trusted Publishing is configured; otherwise the
          # one-time bootstrap token secret (crates.io UI → API Tokens) used
          # to create the crates. Delete the secret after attaching Trusted
          # Publishing to both crates.
          CARGO_REGISTRY_TOKEN: ${{ steps.cratesio.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::no crates.io OIDC token and no CARGO_REGISTRY_TOKEN bootstrap secret — skipping crates.io publish."
            exit 0
          fi
          set -e
          V=$(node -p "require('./package.json').version")
          # `cargo info <name>` resolves workspace members LOCALLY, so from
          # inside this repo it always says our crates exist — ask the
          # registry's sparse index instead.
          on_registry() {
            local n=$1 p
            case ${#n} in
              1) p="1/$n" ;;
              2) p="2/$n" ;;
              3) p="3/${n:0:1}/$n" ;;
              *) p="${n:0:2}/${n:2:2}/$n" ;;
            esac
            curl -sf "https://index.crates.io/$p" | grep -q "\"vers\":\"$V\""
          }
          if on_registry buildwithnexus; then
            echo "buildwithnexus ${V} already on crates.io — skipping."
          else
            cargo publish -p buildwithnexus --locked
          fi
          if on_registry bwn; then
            echo "bwn ${V} already on crates.io — done."
            exit 0
          fi
          # bwn depends on the crate above; wait out index propagation.
          for i in 1 2 3 4 5; do
            if cargo publish -p bwn --locked; then exit 0; fi
            echo "bwn publish attempt ${i} failed (index propagation?) — retrying in 30s"
            sleep 30
          done
          echo "::warning::bwn alias crate did not publish — run 'cargo publish -p bwn' manually."

      - name: Summary
        if: always()
        run: |
          PKG_VERSION=$(node -e 'console.log(require("./package.json").version)')
          {
            echo "### Publish"
            echo ""
            echo "- Version: \`$PKG_VERSION\`"
            echo "- Auth: OIDC Trusted Publisher"
            echo "- Provenance: signed via OIDC"
          } >> "$GITHUB_STEP_SUMMARY"

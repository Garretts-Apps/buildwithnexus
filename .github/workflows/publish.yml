name: Publish to npm

# The published package is a thin, zero-dependency, script-free wrapper: the
# FIRST RUN fetches the SHA-256-verified prebuilt binary for the user's
# platform from the GitHub Release (no npm install scripts — keeps
# supply-chain scanners green). So publishing is just `npm publish` of the
# wrapper — no bundle step.
#
# Sequencing: publishing is chained off the `release` workflow's COMPLETION, not
# the raw `v*` tag. release.yml builds and attaches the per-platform binaries on
# the tag; only once that whole workflow succeeds do we publish to npm — so a
# user never installs a version whose binaries aren't up yet (the first-run
# fast path).
#
# Before npm sees it, the exact tarball that will be published is installed
# in clean Linux containers (the `field` job); any FAIL stops the publish.
on:
  workflow_run:
    workflows: ["release"]
    types: [completed]
  # Re-runs the publish of the version already on the dispatched branch, whose
  # release binaries exist (the sentinel uses this when GitHub drops the
  # workflow_run event). There is deliberately no version bump input: a bump
  # here could not push a tag that starts release.yml, so it published a
  # version with no binaries. Bump through a PR to main instead.
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Verifies the release binaries, records their hashes in checksums.json and
  # packs the tarball the other two jobs test and publish, byte for byte.
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Gate: a successful `release` run — from a v* tag push, an automatic
    # main-push release (version-gated in release.yml), or a manual run — or a
    # direct manual dispatch of this workflow. A failed release never
    # publishes; a version-gated release that skipped chains into a run that
    # self-skips on its own already-published checks.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           (startsWith(github.event.workflow_run.head_branch, 'v') ||
            github.event.workflow_run.head_branch == 'main' ||
            github.event.workflow_run.event == 'workflow_dispatch')) }}
    permissions:
      contents: read
      attestations: read  # verify the release binaries' build provenance
    outputs:
      already: ${{ steps.published.outputs.already }}
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}

    steps:
      # A manual run publishes what is on the dispatched branch, so it must
      # be main: a branch copy of this file must not reach npm.
      - name: Manual runs only from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::publish can only be dispatched from main (got $REF)"
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On the release-triggered path, publish exactly the tagged commit the
          # binaries were built from; on manual dispatch, the current branch.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          persist-credentials: false
          submodules: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Idempotency: npm versions are immutable, so republishing one that already
      # exists hard-fails. The release→publish chain can legitimately re-run for a
      # version that's already live (e.g. a manual publish happened first), so
      # skip the publish instead of failing the run. Every docs-only merge to
      # main lands here too, so this also skips the field run.
      - name: Check if this version is already on npm
        id: published
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "buildwithnexus@$V" version >/dev/null 2>&1; then
            echo "buildwithnexus@$V is already on npm — skipping publish."
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # The tarball npm will get. scripts/pack-verified.sh checks every release
      # binary against its build-provenance attestation and records the
      # verified hashes in checksums.json inside the tarball, which cannot
      # change once published; the launcher's first-run download trusts only
      # these. release.yml packed and tested the same thing before crates.io.
      - name: Pack
        id: pack
        if: steps.published.outputs.already == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/pack-verified.sh

      - name: Hand the tarball to the field and publish jobs
        if: steps.published.outputs.already == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: dist/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  # The packed tarball, installed in clean containers the way users install
  # it, before it can reach npm. Its launcher downloads the release asset,
  # which exists by now (release.yml has finished). One cell per path: a
  # supported glibc as the bare asset and through npm (with the EACCES
  # check), npm on a glibc below the floor, and npm on musl; the two
  # unsupported ones must explain themselves. About three minutes; the full
  # matrix runs in field.yml after the publish. No write or OIDC permission
  # here: this job runs third-party images.
  field:
    needs: pack
    if: needs.pack.outputs.already == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: dist

      # Writes the cell table to the log; exits 1 on any FAIL row.
      - name: Install the tarball in clean containers
        env:
          TARBALL: dist/${{ needs.pack.outputs.tarball }}
        run: >-
          bash scripts/field/linux-install.sh --tarball "$TARBALL"
          --release-yml .github/workflows/release.yml
          --cells ubuntu:22.04,node:22-bookworm,node:20-bullseye,node:22-alpine
          --json field-prepublish.json

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: field-prepublish
          path: field-prepublish.json
          if-no-files-found: ignore
          retention-days: 30

  publish:
    needs: [pack, field]
    # Only after the field run passed. A version already on npm skips the
    # field run and this job; crates.io is published by release.yml.
    if: needs.pack.outputs.already == 'false' && needs.field.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # REQUIRED for OIDC-based npm Trusted Publisher

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          # Auth is OIDC Trusted Publisher (no npm token, no PAT). Checkout only
          # needs read access to this public repo, so the default GITHUB_TOKEN is
          # enough — do NOT require a secret here, or an unset secret makes
          # checkout fail with "could not read Username" before publish runs.
          persist-credentials: false
          submodules: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          # Note: registry-url *intentionally omitted* — when a Trusted Publisher
          # is configured for this package on npmjs.com, npm publish auto-detects
          # the OIDC context from GitHub Actions and uses it for auth. Setting
          # registry-url + .npmrc with NODE_AUTH_TOKEN fights that flow.

      # Node 22 ships npm 10.x, which has no OIDC Trusted Publishing support, so
      # `npm publish` falls back to token auth, finds none, and fails ENEEDAUTH.
      # OIDC trusted publishing requires npm >= 11.5.1 — install it explicitly,
      # pinned so a new npm release can't change the publish path unreviewed.
      - name: Upgrade npm for OIDC trusted publishing
        env:
          NPM_VERSION: "12.1.0"
        run: |
          npm install -g "npm@${NPM_VERSION}"
          npm --version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: dist

      # The tarball the field job installed, not a re-pack.
      - name: Check the tarball is the one that was tested
        env:
          TARBALL: dist/${{ needs.pack.outputs.tarball }}
          SHA256: ${{ needs.pack.outputs.sha256 }}
        run: echo "${SHA256}  ${TARBALL}" | sha256sum -c -

      # === AUTH ===
      # The publish step uses npm's OIDC Trusted Publisher flow. It expects:
      #   1. Trusted Publisher configured on npmjs.com for the
      #      buildwithnexus package, scoped to:
      #        - Org: Garretts-Apps
      #        - Repo: buildwithnexus
      #        - Workflow: publish.yml
      #        - Environment: (blank)
      #   2. id-token: write permission on this job (set above).
      #
      # No NPM_TOKEN is read anywhere in this workflow: npm is OIDC only.
      #
      # Configure here:
      #   https://www.npmjs.com/package/buildwithnexus/access → Trusted Publishers
      - name: Publish to npm (OIDC Trusted Publisher + provenance)
        id: npm-publish
        if: needs.pack.outputs.already == 'false'
        env:
          # ./ makes it a file path: npm 12 reads a bare dist/x.tgz as GitHub
          # shorthand (github:dist/x.tgz) and refuses it with EALLOWGIT,
          # which failed the 0.15.0 publish.
          TARBALL: ./dist/${{ needs.pack.outputs.tarball }}
        run: npm publish "$TARBALL" --access public --provenance

      # Built from what the steps above actually did, not from what they were
      # meant to do.
      - name: Summary
        if: always()
        env:
          ALREADY: ${{ needs.pack.outputs.already }}
          NPM_PUBLISH: ${{ steps.npm-publish.outcome }}
        run: |
          PKG_VERSION=$(node -e 'console.log(require("./package.json").version)')
          if [[ "$ALREADY" == true ]]; then
            npm_line="already on npm, not republished"
          else
            npm_line="${NPM_PUBLISH:-not run} (OIDC Trusted Publisher with provenance)"
          fi
          {
            echo "### Publish"
            echo ""
            echo "- Version: \`$PKG_VERSION\`"
            echo "- npm: ${npm_line}"
            echo "- crates.io: published by release.yml"
          } >> "$GITHUB_STEP_SUMMARY"

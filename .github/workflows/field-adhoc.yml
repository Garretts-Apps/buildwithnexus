name: field-adhoc

# Rehearses command blocks on a clean hosted runner before they are handed to
# the maintainer (see .claude/skills/bwn-field/SKILL.md). Each block runs in a
# fresh process of the chosen shell; on Windows, as a new standard local user
# unless elevated is true. Results go to the job summary, the job log and the
# field-adhoc-<run id> artifact.
#
# The blocks input is code that runs on the runner. Only users with write
# access to this repository can dispatch a workflow, the job's token can only
# read contents, the checkout does not keep it, and the blocks never see it.

run-name: field-adhoc ${{ inputs.os }} ${{ inputs.shell }} elevated=${{ inputs.elevated }}

on:
  workflow_dispatch:
    inputs:
      os:
        description: Runner image (windows-2022 is Windows Server 2022)
        type: choice
        options: [windows-2022, ubuntu-22.04, ubuntu-24.04, macos-15]
        default: windows-2022
      shell:
        description: powershell = Windows PowerShell 5.1 (Windows only); bash on Linux/macOS; pwsh anywhere
        type: choice
        options: [powershell, pwsh, bash]
        default: powershell
      blocks:
        description: Base64 of UTF-8 text; blocks separated by a line "### block"; each has an "# expect:" line
        type: string
        required: true
      elevated:
        description: Run as admin/root instead of a standard user
        type: boolean
        default: false

permissions: {}

jobs:
  rehearse:
    name: ${{ inputs.os }} / ${{ inputs.shell }} / elevated=${{ inputs.elevated }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run blocks (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          BLOCKS_B64: ${{ inputs.blocks }}
          FIELD_SHELL: ${{ inputs.shell }}
          FIELD_ELEVATED: ${{ inputs.elevated }}
          FIELD_CELL: ${{ inputs.os }}
          FIELD_OUT: ${{ github.workspace }}/field-out
        run: bash scripts/field/run-blocks.sh

      # The runner script itself is Windows PowerShell 5.1; each block gets
      # its own new process of the requested shell.
      - name: Run blocks (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          BLOCKS_B64: ${{ inputs.blocks }}
          FIELD_SHELL: ${{ inputs.shell }}
          FIELD_ELEVATED: ${{ inputs.elevated }}
          FIELD_CELL: ${{ inputs.os }}
          FIELD_OUT: ${{ github.workspace }}\field-out
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts\field\run-blocks.ps1

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: field-adhoc-${{ github.run_id }}
          path: field-out
          if-no-files-found: warn
          retention-days: 14

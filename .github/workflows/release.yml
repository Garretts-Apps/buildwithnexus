name: release

# Build the native harness for every supported platform and attach the binaries
# to the GitHub Release. The npm wrapper's first run downloads these.
# publish.yml chains off this workflow's completion to push to npm.
#
# Fully automatic releases: every push to main runs the `gate` job, which
# releases only when package.json's version has no v<version> tag yet. So
# merging a PR that bumps the version ships everything — binaries, GitHub
# release, crates.io, then npm via the chained publish — with zero clicks,
# while docs-only merges do nothing. Tag pushes and manual dispatches from
# main always release. (The tag this workflow creates is made with
# GITHUB_TOKEN, which never triggers workflows — no recursion.)
#
# The release is a draft until the last job: every asset is uploaded and
# attested first, and only then is it published (and its tag created), so a
# public release never exists without binaries. v0.14.9 was public for about
# three minutes with none, and a first run in that window got a 404.
on:
  push:
    tags: ["v*"]
    branches: ["main"]
  workflow_dispatch:

# Nothing by default; each job asks for exactly what it uses.
permissions: {}

# One release at a time. Two quick merges must not interleave their tag,
# asset and checksum uploads; a running release is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release only unreleased versions on main pushes
        id: check
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          # A manual release must come from main; dispatching from a feature
          # branch would publish unreviewed code under a real version.
          if [[ "$EVENT" == workflow_dispatch && "$REF" != refs/heads/main ]]; then
            echo "::error::release can only be dispatched from main (got $REF)"
            exit 1
          fi
          if [[ "$REF" == refs/tags/* || "$EVENT" == workflow_dispatch ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          V=$(node -p "require('./package.json').version")
          # --exit-code: 0 = tag exists, 2 = no such tag, anything else is a
          # lookup failure. Never treat a failed lookup as "untagged", which
          # would re-release (and overwrite the assets of) a shipped version.
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/v${V}" >/dev/null 2>&1 || rc=$?
          case $rc in
            0)
              echo "v${V} is already tagged — nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT" ;;
            2)
              echo "v${V} is not tagged yet — releasing."
              echo "release=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::could not list tags on origin (git ls-remote exit $rc)"
              exit 1 ;;
          esac

  # The full CI workflow on this exact commit. Nothing is tagged, built or
  # published unless it passes: 0.14.6 shipped from a commit that never had a
  # CI run, and #37 merged 3 seconds into a CI run that then failed. (A
  # workflow_run trigger would not do: crates.io OIDC refuses it.)
  ci:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # Creates (or refreshes) the release ONCE, as a draft, with the CHANGELOG
  # section as the body and GitHub's auto-generated notes appended. The build
  # matrix only uploads assets — when this step ran per matrix job with
  # append_body: true, every job (and every re-dispatch) appended another
  # copy of the notes. body replacement here makes re-dispatches idempotent.
  release:
    needs: [gate, ci]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # create the tag and the release
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release tag is the pushed v* tag; otherwise it is derived from
      # package.json so it always matches the version npm will publish.
      - name: Resolve release tag
        id: meta
        shell: bash
        env:
          GIT_REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$GIT_REF" == refs/tags/* ]]; then
            echo "tag=${REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            v=$(node -p "require('./package.json').version")
            echo "tag=v${v}" >> "$GITHUB_OUTPUT"
          fi

      # Pull the matching version section out of CHANGELOG.md for the release
      # body. Falls back to a generic line if the section is missing so the
      # release step never fails on a docs gap.
      - name: Extract release notes
        id: notes
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          version="${TAG#v}"
          out="RELEASE_NOTES.md"
          # Print lines from the matching "## [version]" header up to the next
          # top-level "## " header (exclusive).
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {grab=1; next}
            grab && /^## / {grab=0}
            grab {print}
          ' CHANGELOG.md > "$out"
          if [ ! -s "$out" ]; then
            echo "Release $TAG. See CHANGELOG.md for details." > "$out"
          fi
          echo "path=$out" >> "$GITHUB_OUTPUT"

      # target_commitish ties the tag, created when the draft is published,
      # to the commit this run checked out, not to whatever main points at
      # then. (An existing tag is left where it is.) draft: true on every
      # softprops call: without it the action publishes a new release as
      # soon as its own step ends. An existing release keeps its state, so
      # re-dispatching a shipped version does not hide it.
      - name: Create or update the draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ steps.notes.outputs.path }}
          append_body: false
          generate_release_notes: true
          draft: true

  build:
    needs: [gate, release]
    if: needs.gate.outputs.release == 'true'
    timeout-minutes: 60
    # Read-only: this job compiles third-party code (build scripts,
    # proc-macros), so it gets no token that can write releases or mint
    # OIDC credentials. The `assets` job attests and uploads.
    permissions:
      contents: read
      actions: read         # SignPath reads this job and its artifact
    strategy:
      fail-fast: false
      matrix:
        # Linux builds on 22.04 so the binaries need at most its glibc 2.35
        # (0.14.9 needs 2.34); a 24.04 build needs 2.39. The floor the docs
        # promise is checked after the build.
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      # No credentials on disk while dependency build scripts and proc-macros
      # run (and this job's token can only read).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (branch head 2026-09-29)
        with:
          targets: ${{ matrix.target }}

      # Cross-compilation toolchain for Linux aarch64 (runs on x86_64 runner).
      - name: Install aarch64-linux cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        working-directory: harness
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage asset
        id: stage
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          ext=""; [[ "$TARGET" == *windows* ]] && ext=".exe"
          src="target/$TARGET/release/buildwithnexus${ext}"
          [[ ! -f "$src" ]] && src="harness/target/$TARGET/release/buildwithnexus${ext}"
          asset="buildwithnexus-$TARGET${ext}"
          cp "$src" "$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      # IT teams and security tools read these fields; an .exe without them
      # looks anonymous. harness/build.rs embeds them, and only warns if it
      # can't, so check here that the release binary really has them.
      - name: Check the Windows version resource
        if: contains(matrix.target, 'windows')
        shell: pwsh
        env:
          ASSET: ${{ steps.stage.outputs.asset }}
        run: |
          $v = (Get-Item $env:ASSET).VersionInfo
          $v | Format-List ProductName, CompanyName, FileDescription, ProductVersion, OriginalFilename
          if ($v.ProductName -ne 'buildwithnexus' -or -not $v.ProductVersion) {
            Write-Error "$env:ASSET has no version resource"
            exit 1
          }

      # .cargo/config.toml links the C runtime statically, so the exe starts
      # on a Windows without the Visual C++ Redistributable. 0.14.10 and
      # earlier imported VCRUNTIME140.dll; fail rather than ship that again.
      - name: Check the exe needs no Visual C++ runtime
        if: contains(matrix.target, 'windows')
        shell: bash
        env:
          ASSET: ${{ steps.stage.outputs.asset }}
        run: node scripts/check-pe-imports.js "$ASSET"

      # Authenticode signing through SignPath (free for open source projects
      # via the SignPath Foundation). Off until the repository variable
      # SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN exist;
      # until then the .exe ships unsigned, as before. Project and policy
      # slugs default to "buildwithnexus" and "release-signing". Foundation
      # signing waits for a maintainer to approve the request in SignPath,
      # hence the long timeout.
      - name: Upload the unsigned exe for signing
        id: unsigned
        if: contains(matrix.target, 'windows') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-${{ matrix.target }}
          path: ${{ steps.stage.outputs.asset }}
          if-no-files-found: error
          retention-days: 1

      - name: Sign the exe (SignPath)
        if: contains(matrix.target, 'windows') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'buildwithnexus' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Use the signed exe
        if: contains(matrix.target, 'windows') && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        env:
          ASSET: ${{ steps.stage.outputs.asset }}
        run: |
          Copy-Item "signed/$env:ASSET" $env:ASSET -Force
          $sig = Get-AuthenticodeSignature $env:ASSET
          $sig | Format-List Status, StatusMessage
          $sig.SignerCertificate | Format-List Subject, Issuer, NotAfter
          if ($sig.Status -ne 'Valid') {
            Write-Error "$env:ASSET signature is $($sig.Status)"
            exit 1
          }

      # Checksum last, so it covers the signed file.
      - name: Checksum
        shell: bash
        env:
          ASSET: ${{ steps.stage.outputs.asset }}
        run: |
          if command -v sha256sum >/dev/null; then sha256sum "$ASSET" > "$ASSET.sha256";
          else shasum -a 256 "$ASSET" > "$ASSET.sha256"; fi
          cat "$ASSET.sha256"

      # The floor lives in scripts/diagnose.js, which the launcher quotes when
      # a binary fails on an older glibc, and the docs repeat. A binary that
      # needs more would make both wrong, so it fails the release instead.
      # ci.yml runs the same check on every PR, so this should never fire.
      - name: Check the glibc floor
        if: contains(matrix.target, 'linux')
        env:
          TARGET: ${{ matrix.target }}
        run: scripts/check-glibc-floor.sh "buildwithnexus-$TARGET"

      - name: Hand the asset to the assets job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asset-${{ matrix.target }}
          path: buildwithnexus-${{ matrix.target }}*
          if-no-files-found: error
          retention-days: 1

  # Attests and uploads what the build jobs produced. It compiles nothing,
  # so the write and OIDC permissions live only here.
  assets:
    needs: [release, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # upload release assets
      id-token: write       # build provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: asset-*
          merge-multiple: true
          path: dist

      - name: Check every platform is present
        working-directory: dist
        run: |
          set -euo pipefail
          ls -la
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc; do
            ext=""; [[ "$t" == *windows* ]] && ext=".exe"
            test -f "buildwithnexus-$t$ext" && test -f "buildwithnexus-$t$ext.sha256"
            sha256sum -c "buildwithnexus-$t$ext.sha256"
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/buildwithnexus-x86_64-unknown-linux-gnu
            dist/buildwithnexus-aarch64-unknown-linux-gnu
            dist/buildwithnexus-x86_64-apple-darwin
            dist/buildwithnexus-aarch64-apple-darwin
            dist/buildwithnexus-x86_64-pc-windows-msvc.exe

      # Asset upload only — the `release` job created the release and owns
      # the body (softprops leaves unspecified fields untouched).
      - name: Upload assets to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/buildwithnexus-*
          draft: true

  # CycloneDX SBOM of every crate compiled into the binary, for teams that
  # review third-party software before allowing it.
  sbom:
    needs: [gate, release]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # upload the release asset
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (branch head 2026-09-29)

      - name: Generate the SBOM
        run: |
          set -euo pipefail
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --manifest-path harness/Cargo.toml -f json --target all \
            --override-filename buildwithnexus.cdx
          mv harness/buildwithnexus.cdx.json buildwithnexus.cdx.json

      - name: Upload the SBOM to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: buildwithnexus.cdx.json
          draft: true

  # crates.io publishing lives HERE, not in publish.yml: crates.io Trusted
  # Publishing refuses OIDC tokens for workflow_run-triggered jobs, and
  # publish.yml chains off this workflow via workflow_run — so its crates step
  # could never authenticate without a stored token. This workflow's triggers
  # (v* tag push, workflow_dispatch) are both accepted. Requires a Trusted
  # Publishing entry on BOTH crates pointing at workflow file `release.yml`.
  # Idempotent: versions already on the registry are skipped, so
  # re-dispatching a release is safe. Anything else that goes wrong (no OIDC
  # token, a publish error) fails the job, so a half-published release shows
  # up red instead of green-with-a-warning.
  crates:
    needs: [gate, assets]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # crates.io Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `cargo info <name>` resolves workspace members LOCALLY, so from
      # inside this repo it always says our crates exist — ask the
      # registry's sparse index instead.
      - name: Check what is already on crates.io
        id: need
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          on_registry() {
            local n=$1 p body
            case ${#n} in
              1) p="1/$n" ;;
              2) p="2/$n" ;;
              3) p="3/${n:0:1}/$n" ;;
              *) p="${n:0:2}/${n:2:2}/$n" ;;
            esac
            body=$(curl -fsS --retry 3 "https://index.crates.io/$p")
            grep -q "\"vers\":\"$V\"" <<<"$body"
          }
          for c in buildwithnexus bwn; do
            if on_registry "$c"; then
              echo "$c ${V} already on crates.io — skipping."
              echo "$c=false" >> "$GITHUB_OUTPUT"
            else
              echo "$c=true" >> "$GITHUB_OUTPUT"
            fi
          done

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (branch head 2026-09-29)
        if: steps.need.outputs.buildwithnexus == 'true' || steps.need.outputs.bwn == 'true'

      - name: Get crates.io token via OIDC
        if: steps.need.outputs.buildwithnexus == 'true' || steps.need.outputs.bwn == 'true'
        id: cratesio
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        if: steps.need.outputs.buildwithnexus == 'true' || steps.need.outputs.bwn == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.cratesio.outputs.token }}
          NEED_MAIN: ${{ steps.need.outputs.buildwithnexus }}
          NEED_BWN: ${{ steps.need.outputs.bwn }}
        run: |
          set -euo pipefail
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::no crates.io OIDC token. Add a Trusted Publishing entry for workflow release.yml on both crates, then re-run this job."
            exit 1
          fi
          # A version that is already uploaded (a race with a manual publish,
          # or a stale index read) counts as done, not as a failure.
          publish() {
            local out
            if out=$(cargo publish -p "$1" --locked 2>&1); then
              echo "$out"; return 0
            fi
            echo "$out"
            if grep -qiE 'already (uploaded|exists)' <<<"$out"; then
              echo "$1 is already on crates.io — treating as published."
              return 0
            fi
            return 1
          }
          if [ "$NEED_MAIN" = true ]; then
            publish buildwithnexus
          fi
          if [ "$NEED_BWN" != true ]; then
            exit 0
          fi
          # bwn depends on the crate above; wait out index propagation.
          for i in 1 2 3 4 5; do
            if publish bwn; then exit 0; fi
            echo "bwn publish attempt ${i} failed (index propagation?) — retrying in 30s"
            sleep 30
          done
          echo "::error::bwn alias crate did not publish after 5 attempts. Re-run this job; buildwithnexus itself is already published."
          exit 1

  # Last: publish the draft once everything is on it. The workflow only
  # succeeds (and publish.yml, which chains on that, only starts) after this,
  # so the npm launcher's download never races the assets. Drafts are
  # invisible to unauthenticated reads, so neither the launcher's download
  # nor field.yml can see the release before this job.
  publish-release:
    needs: [gate, release, assets, sbom, crates]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # publish the release, which creates the tag
    steps:
      - name: Check every asset is on the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          have=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          missing=0
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc; do
            ext=""; [[ "$t" == *windows* ]] && ext=".exe"
            for a in "buildwithnexus-$t$ext" "buildwithnexus-$t$ext.sha256"; do
              grep -qxF "$a" <<<"$have" || { echo "::error::$TAG has no $a"; missing=1; }
            done
          done
          grep -qxF buildwithnexus.cdx.json <<<"$have" || { echo "::error::$TAG has no buildwithnexus.cdx.json"; missing=1; }
          exit "$missing"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,url

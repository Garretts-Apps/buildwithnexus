[package]
name = "bwn"
version = "0.20.0"
edition = "2021"
rust-version = "1.94"
description = "bwn — short-name alias crate for the buildwithnexus agentic AI coding CLI"
license = "MIT"
repository = "https://github.com/Garretts-Apps/buildwithnexus"
homepage = "https://buildwithnexus.dev"
# docs.rs runs `cargo rustdoc --lib` and fails a binary-only crate with
# "no library targets found" (bwn 0.20.0's build did). src/lib.rs is that
# target; the page points at the product site.
readme = "README.md"
keywords = ["ai", "agent", "cli", "tui", "llm"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "bwn"
path = "src/main.rs"

[dependencies]
# Path for workspace builds; version for the published crate.
buildwithnexus = { version = "0.20.0", path = "../harness" }
